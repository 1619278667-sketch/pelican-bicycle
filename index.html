<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican on a Bicycle</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    background: linear-gradient(160deg, #fdf6ec, #eef7ff);
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #33404a;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 18px 22px 24px;
    box-shadow: 0 18px 50px rgba(50, 70, 90, .16);
  }
  h1 { margin: 0; font-size: 1.3rem; letter-spacing: .2px; }
  p  { margin: 4px 0 6px; color: #77838c; font-size: .86rem; }
  svg { display: block; max-width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="card">
    <h1>🚴 A Pelican Goes for a Ride</h1>
    <p>Pure SVG + SMIL animation &middot; no libraries, no scripts</p>

    <svg width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="A pelican riding a bicycle">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#bfe3ff"/>
          <stop offset="1" stop-color="#eef7ff"/>
        </linearGradient>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7cc27c"/>
          <stop offset="1" stop-color="#58a658"/>
        </linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="#ffe08a" stop-opacity="0.9"/>
          <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- ===== Sky ===== -->
      <rect x="0" y="0" width="800" height="420" fill="url(#sky)"/>
      <circle cx="700" cy="95" r="70" fill="url(#sunGlow)"/>
      <circle cx="700" cy="95" r="36" fill="#ffd166"/>

      <!-- Drifting clouds -->
      <g fill="#ffffff" opacity="0.9">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 90 0; 0 0" dur="32s" repeatCount="indefinite"/>
          <ellipse cx="140" cy="90" rx="46" ry="16"/>
          <ellipse cx="175" cy="78" rx="30" ry="13"/>
          <ellipse cx="110" cy="80" rx="24" ry="11"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; -70 0; 0 0" dur="40s" repeatCount="indefinite"/>
          <ellipse cx="520" cy="120" rx="38" ry="13"/>
          <ellipse cx="552" cy="110" rx="26" ry="11"/>
          <ellipse cx="496" cy="112" rx="20" ry="9"/>
        </g>
      </g>

      <!-- ===== Ground ===== -->
      <rect x="0" y="410" width="800" height="90" fill="url(#grass)"/>
      <rect x="0" y="406" width="800" height="34" fill="#e8e0cc"/>
      <line x1="0" y1="423" x2="800" y2="423" stroke="#c9c0ac" stroke-width="3" stroke-dasharray="30 22">
        <animate attributeName="stroke-dashoffset" values="0; -52" dur="0.6s" repeatCount="indefinite"/>
      </line>

      <!-- Soft shadows under wheels -->
      <ellipse cx="250" cy="419" rx="44" ry="6" fill="#000000" opacity="0.12"/>
      <ellipse cx="550" cy="419" rx="44" ry="6" fill="#000000" opacity="0.12"/>

      <!-- ===== Far leg (behind the frame) ===== -->
      <path fill="none" stroke="#c96f18" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="d" begin="-0.6s" dur="1.2s" repeatCount="indefinite" calcMode="linear"
          values="M340,250 L386.6,290.9 L398.0,360.0;M340,250 L363.5,311.4 L389.8,379.8;M340,250 L354.2,315.3 L370.0,388.0;M340,250 L355.6,310.0 L350.2,379.8;M340,250 L377.3,299.5 L342.0,360.0;M340,250 L391.9,284.0 L350.2,340.2;M340,250 L399.2,268.4 L370.0,332.0;M340,250 L398.4,270.7 L389.8,340.2"/>
      </path>

      <!-- ===== Rear wheel ===== -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 250 360" to="360 250 360" dur="0.8s" repeatCount="indefinite"/>
        <circle cx="250" cy="360" r="54" fill="none" stroke="#333a40" stroke-width="8"/>
        <circle cx="250" cy="360" r="44" fill="none" stroke="#9aa3ad" stroke-width="2.5"/>
        <g stroke="#c2c9d0" stroke-width="2">
          <line x1="250" y1="316" x2="250" y2="404"/>
          <line x1="206" y1="360" x2="294" y2="360"/>
          <line x1="219" y1="329" x2="281" y2="391"/>
          <line x1="281" y1="329" x2="219" y2="391"/>
        </g>
        <circle cx="250" cy="360" r="6" fill="#333a40"/>
        <circle cx="250" cy="306" r="3" fill="#e76f51"/>
      </g>

      <!-- ===== Front wheel ===== -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 550 360" to="360 550 360" dur="0.8s" repeatCount="indefinite"/>
        <circle cx="550" cy="360" r="54" fill="none" stroke="#333a40" stroke-width="8"/>
        <circle cx="550" cy="360" r="44" fill="none" stroke="#9aa3ad" stroke-width="2.5"/>
        <g stroke="#c2c9d0" stroke-width="2">
          <line x1="550" y1="316" x2="550" y2="404"/>
          <line x1="506" y1="360" x2="594" y2="360"/>
          <line x1="519" y1="329" x2="581" y2="391"/>
          <line x1="581" y1="329" x2="519" y2="391"/>
        </g>
        <circle cx="550" cy="360" r="6" fill="#333a40"/>
        <circle cx="550" cy="306" r="3" fill="#e76f51"/>
      </g>

      <!-- ===== Frame ===== -->
      <g stroke="#2a9d8f" stroke-width="6" stroke-linecap="round" fill="none">
        <line x1="370" y1="360" x2="330" y2="238"/>   <!-- seat tube -->
        <line x1="370" y1="360" x2="526" y2="266"/>   <!-- down tube -->
        <line x1="330" y1="238" x2="518" y2="242"/>   <!-- top tube -->
        <line x1="370" y1="360" x2="250" y2="360"/>   <!-- chainstay -->
        <line x1="330" y1="238" x2="250" y2="360"/>   <!-- seat stay -->
        <line x1="522" y1="256" x2="550" y2="360"/>   <!-- fork -->
        <line x1="518" y1="242" x2="526" y2="266" stroke-width="8"/> <!-- head tube -->
      </g>
      <!-- seat post + saddle -->
      <line x1="330" y1="238" x2="326" y2="222" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round"/>
      <path d="M302,222 Q326,212 350,222 Q326,228 302,222 Z" fill="#3a4148"/>
      <!-- handlebar -->
      <path d="M518,242 L510,220 M510,220 C502,216 496,222 500,232" stroke="#3a4148" stroke-width="5" fill="none" stroke-linecap="round"/>

      <!-- ===== Crank (chainring + arms + pedals) ===== -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 370 360" to="360 370 360" dur="1.2s" repeatCount="indefinite"/>
        <circle cx="370" cy="360" r="17" fill="#f3f4f6" stroke="#4b5563" stroke-width="4"/>
        <g fill="#4b5563">
          <circle cx="370" cy="351" r="2.2"/>
          <circle cx="370" cy="369" r="2.2"/>
          <circle cx="361" cy="360" r="2.2"/>
          <circle cx="379" cy="360" r="2.2"/>
        </g>
        <line x1="370" y1="360" x2="398" y2="360" stroke="#444b52" stroke-width="7" stroke-linecap="round"/>
        <line x1="370" y1="360" x2="342" y2="360" stroke="#444b52" stroke-width="7" stroke-linecap="round"/>
        <line x1="385" y1="360" x2="411" y2="360" stroke="#2f343a" stroke-width="5" stroke-linecap="round"/>
        <line x1="329" y1="360" x2="355" y2="360" stroke="#2f343a" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- chain (static) -->
      <g stroke="#9aa3ad" stroke-width="2.5" fill="none">
        <line x1="352" y1="348" x2="268" y2="352"/>
        <line x1="352" y1="372" x2="268" y2="368"/>
      </g>
      <circle cx="250" cy="360" r="7" fill="#ffffff" stroke="#4b5563" stroke-width="3"/>

      <!-- ===== Near leg (in front of the frame) ===== -->
      <path fill="none" stroke="#e8891e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear"
          values="M340,250 L386.6,290.9 L398.0,360.0;M340,250 L363.5,311.4 L389.8,379.8;M340,250 L354.2,315.3 L370.0,388.0;M340,250 L355.6,310.0 L350.2,379.8;M340,250 L377.3,299.5 L342.0,360.0;M340,250 L391.9,284.0 L350.2,340.2;M340,250 L399.2,268.4 L370.0,332.0;M340,250 L398.4,270.7 L389.8,340.2"/>
      </path>

      <!-- ===== Feet (locked to pedals) ===== -->
      <g fill="#e8891e" stroke="#c9740f" stroke-width="1">
        <animateTransform attributeName="transform" type="rotate" from="0 370 360" to="360 370 360" dur="1.2s" repeatCount="indefinite"/>
        <g>
          <ellipse cx="398" cy="358" rx="11" ry="5"/>
          <line x1="405" y1="356" x2="416" y2="354" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="406" y1="358" x2="418" y2="358" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="405" y1="360" x2="416" y2="362" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <g>
          <ellipse cx="342" cy="358" rx="11" ry="5"/>
          <line x1="349" y1="356" x2="360" y2="354" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="350" y1="358" x2="362" y2="358" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="349" y1="360" x2="360" y2="362" stroke-width="2.5" stroke-linecap="round"/>
        </g>
      </g>

      <!-- ===== Pelican ===== -->
      <!-- neck (behind body & head) -->
      <path d="M376,132 C362,154 344,170 320,184 L340,198 C356,182 374,156 388,136 Z" fill="#faf7f0"/>

      <!-- tail -->
      <path d="M262,192 C244,182 236,188 230,200 C244,202 252,198 262,202 Z" fill="#ece5d2" stroke="#d9d2c2" stroke-width="1.2"/>

      <!-- body -->
      <ellipse cx="300" cy="180" rx="66" ry="46" fill="#faf7f0" stroke="#d9d2c2" stroke-width="1.5" transform="rotate(-6 300 180)"/>

      <!-- wing -->
      <path d="M322,158 C300,166 276,182 268,198 C288,197 308,186 326,168 Z" fill="#ece5d2" stroke="#d9d2c2" stroke-width="1.2"/>
      <path d="M314,164 C298,172 282,184 275,194" fill="none" stroke="#d9d2c2" stroke-width="1.2"/>
      <path d="M308,172 C296,178 286,188 281,196" fill="none" stroke="#d9d2c2" stroke-width="1.2"/>

      <!-- head -->
      <circle cx="385" cy="112" r="20" fill="#faf7f0" stroke="#d9d2c2" stroke-width="1.5"/>
      <path d="M372,96 C368,90 366,92 368,97 C370,95 371,96 372,96 Z" fill="#ece5d2"/>

      <!-- beak -->
      <path d="M402,101 C428,96 454,104 473,119 L473,126 C452,118 430,113 404,115 Z" fill="#e8891e" stroke="#c9740f" stroke-width="1.2"/>
      <path d="M404,115 C430,119 456,124 473,126 C465,154 442,177 411,171 C400,151 398,133 402,121 Z" fill="#f4b83f" stroke="#d99a26" stroke-width="1.2"/>
      <path d="M404,116 L473,126" stroke="#c9740f" stroke-width="1.4"/>
      <circle cx="410" cy="105" r="1.4" fill="#a85f0e"/>

      <!-- eye -->
      <circle cx="393" cy="106" r="3.2" fill="#1f2326"/>
      <circle cx="394" cy="104.6" r="1.1" fill="#ffffff"/>
    </svg>
  </div>
</body>
</html>
